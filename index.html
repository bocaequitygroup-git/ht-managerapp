<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HT-ManagerApp</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#0d1b14;--mut:#53645a;--line:#cdd6cf;--hd:#0d1b14;--hdi:#f2f6f2;--acc:#0b6b3a;--on:#fff;--must:#c62d1f;--att:#b86e00;--ok:#0b6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#0b130e;--card:#15221a;--ink:#eef4ee;--mut:#9fb2a5;--line:#2a3d30;--hd:#050b07;--acc:#52c985;--on:#06110a;--must:#ff7a6b;--att:#f0b04a;--ok:#52c985}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{background:var(--hd);color:var(--hdi);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:17px;flex:1;min-width:0}header small{display:block;font-weight:400;opacity:.75;font-size:12px}
.dot{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid currentColor;white-space:nowrap}.dot.off{color:#ff9a8e}
main{max-width:720px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:4}
.tabs button{flex:none;background:none;border:2px solid transparent;border-radius:10px;font:inherit;font-weight:700;padding:8px 12px;min-height:44px;color:var(--ink);white-space:nowrap}.tabs button.on{background:var(--acc);color:var(--on)}
.who{line-height:1.15;text-align:right}.who small{display:block}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kv span{display:block;font-size:12px;color:var(--mut)}.kv b{font-size:17px}
header{flex-wrap:wrap}nav{display:none;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--hd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;background:none;border:0;color:var(--hdi);opacity:.7;font:inherit;font-size:13px;font-weight:700;padding:10px 2px;min-height:48px;border-radius:10px}
nav button.on{opacity:1;background:var(--acc);color:var(--on)}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:17px;margin:18px 0 8px}.mut{color:var(--mut);font-size:14px}
button,input,select,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;font-weight:700;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on)}.btn.w{border-color:var(--att);color:var(--att)}.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--ok);border-radius:12px;padding:12px;margin-bottom:10px}
.card.PAUSED,.card.Attention{border-left-color:var(--att)}.card.Must,.card.HIGH{border-left-color:var(--must)}.card.MEDIUM{border-left-color:var(--att)}.card.flat{border-left-color:var(--line)}
.r{display:flex;gap:8px;align-items:center}.r>.g{flex:1;min-width:0}.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1}
.t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--ok);color:var(--on)}.tag.PAUSED,.tag.MEDIUM{background:var(--att)}.tag.HIGH{background:var(--must)}.tag.LOW{background:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chips .btn{min-height:42px;padding:6px 12px}.chips .on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.err{background:var(--must);color:#fff;padding:10px 12px;border-radius:12px;margin:8px 0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}.sum b{font-size:26px;display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#login{max-width:380px;margin:12vh auto 0;padding:0 14px}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none}
video{width:100%;border-radius:12px;background:#000}
.rb{margin-top:6px;padding:6px 10px;border-radius:10px;background:rgba(184,110,0,.14);border-left:4px solid var(--att);font-size:14px}
</style></head><body>
<div id="app"></div><div id="ov"></div><div id="toast"></div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxOW7gq6C_jkWB5fVaFsO8sZmCwgsnPOU353own_8i-bPARdx0MGBKRjNO7lAPhZApTVw/exec'; // '' = demo mode (built-in sample data)
const REQUEST_TIMEOUT_MS=20000,BOARD_REFRESH_MS=30000;
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GSR=()=>typeof google!=='undefined'&&!!(google.script&&google.script.run);
/* tolerant getter: first present key, ignoring case, spaces and underscores */
const nk=k=>String(k).toLowerCase().replace(/[\s_]/g,'');
const g=(o,...ks)=>{if(!o)return'';for(const k of ks){if(o[k]!=null&&o[k]!=='')return o[k];const f=Object.keys(o).find(x=>nk(x)===nk(k));if(f&&o[f]!=null&&o[f]!=='')return o[f]}return''};
let SESS='',ME=null,V='today',SH=null,ERR='',on=navigator.onLine,busy=0,last=0,FL={sev:'',dom:'',q:''},HQ='',LE='';   // session token lives in memory only
let D={beds:{},cohorts:[],tasks:[],exceptions:[],workers:[]},X={open:[],done:[],scout:[],moves:[]};
const today=()=>new Date().toISOString().slice(0,10),now=()=>Date.now();
const el=s=>(g(s,'end')||(g(s,'status')==='PAUSED'?g(s,'pauseAt'):now()))-g(s,'start')-(+g(s,'pausedMs')||0);
const fmt=ms=>{let s=Math.max(0,Math.floor(ms/1e3));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)};

/* ---------- API: Apps Script /exec (text/plain JSON) or built-in demo ---------- */
async function api(a,d){
 if(!WEB_APP_URL&&!GSR())return mock(a,d||{});
 const body=JSON.stringify({action:a,session:SESS,...d}),ac=new AbortController(),t=setTimeout(()=>ac.abort(),REQUEST_TIMEOUT_MS);
 try{let r;
  if(GSR())r=JSON.parse(await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).apiCall(body)));
  else r=await(await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ac.signal})).json();
  on=true;if(!r.ok){if(r.auth)out('Session expired. Please sign in again.');throw new Error(r.error||'Server error')}return r}
 catch(e){if(e.name==='AbortError')throw new Error('Request timed out. Check signal.');if(e instanceof TypeError){on=false;throw new Error('Cannot reach the server.')}throw e}
 finally{clearTimeout(t)}}
async function load(){if(busy||!SESS)return;busy=1;try{const r=await api('mBoard');D=r.data||D;X=r.x||X;last=now();ERR=''}catch(e){ERR=e.message}busy=0;render()}
async function act(a,d,msg){try{await api(a,d);SH=null;toast(msg);await load()}catch(e){toast(e.message)}}

/* ---------- auth: Manager / Founder only ---------- */
async function login(){const id=$('#u').value.trim(),pin=$('#p').value;if(!id||!pin){LE='Enter your Worker ID and PIN.';return render()}
 LE='';busy=1;render();
 try{const r=await api('login',{userId:id,pin,ua:navigator.userAgent.slice(0,160)});
  if(!/^(manager|founder)$/i.test(g(r.user,'role'))){SESS=r.session;api('logout').catch(()=>{});SESS='';throw new Error('Access denied: Manager or Founder accounts only.')}
  SESS=r.session;ME=r.user;D=r.data||D;busy=0;await load()}
 catch(e){busy=0;SESS='';LE=e.message;render()}}
function out(msg){if(SESS)api('logout').catch(()=>{});SESS='';ME=null;SH=null;LE=msg||'';render()}

/* ---------- derived ---------- */
const exOpen=b=>D.exceptions.filter(e=>g(e,'bed')===b&&g(e,'open'));
const pri=t=>{const b=g(t,'bed'),ex=exOpen(b);return ex.some(e=>g(e,'sev')==='HIGH')||D.cohorts.some(c=>g(c,'bed')===b&&g(c,'status')==='HARVEST_READY')?'Must Do':ex.length?'Attention':'Routine'};
const parseBed=q=>{const m=/(?:HT-?)?B\s*([1-6])[-_ ]\s*0?([1-6])(?!\d)/i.exec(String(q));return m?`HT-B${m[1]}-0${m[2]}`:''};
const workers=()=>(D.workers&&D.workers.length?D.workers:[]);

/* ---------- views ---------- */
function sCard(s,tools){const p=g(s,'status')==='PAUSED';
 return`<div class="card ${esc(g(s,'status'))}"><div class="r"><div class="g"><span class="tag ${esc(g(s,'status'))}">${p?'PAUSED · '+esc(g(s,'reason')||'no reason'):esc(g(s,'status')||'DONE')}</span>
 <div style="font-weight:800;font-size:18px;margin-top:4px">${esc(g(s,'bed'))} · ${esc(g(s,'act'))}</div><div class="mut">${esc(g(s,'worker'))}${g(s,'cohort')?' · '+esc(g(s,'cohort')):''}${g(s,'qty')?' · '+Math.round(g(s,'qty')*10)/10+' lb':''}</div></div>
 <div class="t" data-t="${esc(g(s,'id'))}">${fmt(el(s))}</div></div>${tools?`<div class="btns"><button class="btn" onclick="SH={k:'re',id:'${esc(g(s,'id'))}'};draw()">Reassign</button><button class="btn w" onclick="SH={k:'cl',id:'${esc(g(s,'id'))}'};draw()">Close out</button></div>`:''}</div>`}
const bshort=b=>String(b||'').replace(/^HT-/,''),Q=()=>X.queue||D.tasks.filter(t=>g(t,'status')==='ASSIGNED'),
 cropOf=id=>{const c=D.cohorts.find(x=>g(x,'id')===id);return c?g(c,'cropName','crop'):''};
const reP=r=>{try{return typeof r==='string'?(r?JSON.parse(r):null):r}catch(e){return null}};
const reBox=r=>{r=reP(r);return r&&r.from?`<div class="rb">↪ Reassigned from <b>${esc(r.from)}</b> to <b>${esc(r.to)}</b>${r.note?' · “'+esc(r.note)+'”':''}</div>`:''};
function oCard(o,q){const p=g(o,'status')==='PAUSED',id=esc(g(o,'id')),co=g(o,'cohort'),tk=D.tasks.find(t=>g(t,'id')===g(o,'task'))||{},ds=g(o,'desc')||g(tk,'desc'),ab=g(o,'assignedBy')||g(tk,'by');
 return`<div class="card ${q?'flat':p?'PAUSED':''}"><b style="font-size:19px">${esc(g(o,'worker'))}</b>
 <div style="font-weight:800;font-size:18px">${esc(g(o,'act'))}</div>${ds?`<div class="mut">${esc(ds)}</div>`:''}${ab?`<div class="mut">Assigned by ${esc(ab)}</div>`:''}${reBox(g(o,'re'))}
 <div style="margin-top:6px"><span class="tag ${q?'LOW':p?'PAUSED':''}">${q?'Not started':p?'Paused':'In progress'}</span> <span class="mut">${q?'assigned, waiting':p?esc(g(o,'reason')||'paused'):'running'}</span></div>
 <div class="${q?'mut':'t'}" ${q?'':`data-t="${id}"`} style="margin-top:4px">${q?'Waiting for worker to start':fmt(el(o))}</div>
 <div class="kv"><div><span>Bed</span><b>${esc(bshort(g(o,'bed')))}</b></div><div><span>Cohort</span><b>${esc(co||'-')}</b></div><div><span>Crop</span><b>${esc(cropOf(co)||'-')}</b></div></div>
 <div class="btns"><button class="btn" onclick="SH={k:'re',id:'${id}',q:${q?1:0}};draw()">Reassign</button>${!q?`<button class="btn w" onclick="SH={k:'cl',id:'${id}'};draw()">Close out</button>`:''}</div></div>`}
function vToday(){const o=X.open,q=Q(),n=o.length+q.length;
 return`<h1>Open field sessions</h1><p class="mut" style="margin:-6px 0 12px">${n} open, updated ${last?new Date(last).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'-'}</p>`
 +(n?o.map(x=>oCard(x,0)).join('')+q.map(x=>oCard(x,1)).join(''):'<p class="mut">No open sessions right now.</p>')}
function vReady(){return`<h1>Harvest ready</h1><div class="r"><input id="hq" placeholder="Bed ID, e.g. HT-B2-03 or B2" value="${esc(HQ)}" oninput="HQ=this.value;$('#hl').innerHTML=hList()" aria-label="Find bed">${'BarcodeDetector' in window?'<button class="btn" onclick="scanQR()" aria-label="Scan QR">📷</button>':''}</div><div id="hl" style="margin-top:10px">${hList()}</div>`}
function vComplete(){const hs=[...X.open,...X.done].filter(s=>g(s,'act')==='Harvest');return`<h1>Harvest complete</h1>${hs.map(s=>sCard(s,g(s,'status')!=='DONE')).join('')||'<p class="mut">No harvests in the last 48 hours.</p>'}`}
function hList(rd){const q=HQ.trim().toUpperCase();rd=rd||D.cohorts.filter(c=>['HARVEST_READY','HARVESTING'].includes(g(c,'status'))&&(!q||g(c,'bed').includes(q)||g(c,'bed')===parseBed(q)));
 return rd.map(c=>`<div class="card Must"><div class="r"><div class="g"><b>${esc(g(c,'bed'))} · ${esc(g(c,'cropName','crop'))}</b><div class="mut">${esc(g(c,'id'))} · planted ${esc(g(c,'dob'))} · ${esc(g(c,'cases'))} cases target · vestibule ${esc(g(c,'vest'))}</div></div><span class="tag">${esc(g(c,'status').replace('_',' '))}</span></div>
 <div class="btns"><button class="btn p" onclick="SH={k:'as',bed:'${esc(g(c,'bed'))}'};draw()">Assign harvest</button></div></div>`).join('')||'<p class="mut">No harvest-ready beds match.</p>'}
function vScout(){const S=X.scout.filter(f=>(!FL.sev||g(f,'sev')===FL.sev)&&(!FL.dom||g(f,'domain')===FL.dom)&&(!FL.q||g(f,'bed').includes(FL.q.toUpperCase()))),
 ch=(k,l)=>`<div class="chips">${['',...l].map(v=>`<button class="btn ${FL[k]===v?'on':''}" onclick="FL.${k}='${v}';render()">${v||'All'}</button>`).join('')}</div>`;
 return`<h1>Scouting findings</h1>${ch('sev',['HIGH','MEDIUM','LOW'])}${ch('dom',['Pest pressure','Disease','Plant condition','Soil & water','Weeds'])}<input placeholder="Filter by bed, e.g. B2" value="${esc(FL.q)}" oninput="FL.q=this.value;$('#sl').innerHTML=sList()" style="margin:6px 0 10px"><div id="sl">${sList(S)}</div>`}
function sList(S){S=S||X.scout.filter(f=>(!FL.sev||g(f,'sev')===FL.sev)&&(!FL.dom||g(f,'domain')===FL.dom)&&(!FL.q||g(f,'bed').includes(FL.q.toUpperCase())));
 return S.map(f=>`<div class="card ${esc(g(f,'sev'))}"><div class="r"><div class="g"><b>${esc(g(f,'bed'))} · ${esc(g(f,'domain'))}</b></div><span class="tag ${esc(g(f,'sev'))}">${esc(g(f,'sev'))}</span></div><div>${esc(g(f,'notes'))}</div><div class="mut">${esc(g(f,'worker'))} · ${esc(g(f,'at'))}</div></div>`).join('')||'<p class="mut">No findings match.</p>'}
function vLog(){return`<h1>Activity log</h1>${X.done.map(s=>sCard(s,0)).join('')||'<p class="mut">Nothing completed in the last 48 hours.</p>'}`}
function vMoves(){const all=[...X.open,...X.done,...Q()];
 return`<h1>Reassignments</h1>`+(X.moves.map(h=>{const x=/^(\S+): (.+?) -> (.+?)(?: \((.*)\))?$/.exec(g(h,'detail'))||[],it=all.find(i=>g(i,'id')===x[1]);
  return`<div class="card flat"><b>${esc(x[2]||'?')} → ${esc(x[3]||g(h,'detail'))}</b>${it?`<div>${esc(bshort(g(it,'bed')))} · ${esc(g(it,'act'))}</div>`:''}${x[4]?`<div class="mut">“${esc(x[4])}”</div>`:''}<div class="mut">by ${esc(g(h,'by'))} · ${esc(g(h,'at'))}</div></div>`}).join('')||'<p class="mut">No hand-offs logged.</p>')}
function vLogin(){return`<div id="login"><h1>HT-ManagerApp</h1><p class="mut">High tunnels · sign in with your Worker ID and PIN.</p>${LE?`<div class="err">${esc(LE)}</div>`:''}
 <label class="mut" for="u">Worker ID</label><input id="u" autocapitalize="none" autocomplete="username"><div style="height:10px"></div><label class="mut" for="p">PIN</label><input id="p" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
 <button class="btn p" style="width:100%;margin-top:14px" ${busy?'disabled':''} onclick="login()">${busy?'Signing in…':'Sign in'}</button>${WEB_APP_URL||GSR()?'':'<p class="mut">Demo mode · any ID, PIN 1234</p>'}</div>`}
function sheet(){const s=SH,ses=[...X.open,...Q()].find(x=>g(x,'id')===s.id),W=workers().map(w=>`<option>${esc(w)}</option>`).join('');let h='';
 if(s.k==='re')h=`<h1>Reassign ${esc(g(ses,'bed'))} · ${esc(g(ses,'act'))}</h1><p class="mut">Currently ${esc(g(ses,'worker'))}</p><select id="sw">${W}</select><textarea id="sn" rows="2" placeholder="Note (optional)" style="margin-top:8px"></textarea><button class="btn p" style="width:100%;margin-top:10px" onclick="reDo()">Reassign</button>`;
 if(s.k==='cl')h=`<h1>Close out ${esc(g(ses,'bed'))} · ${esc(g(ses,'act'))}?</h1><p class="mut">${esc(g(ses,'worker'))}'s timer stops now.</p><textarea id="sn" rows="3" placeholder="Note (optional)"></textarea><button class="btn p" style="width:100%;margin-top:10px" onclick="act('mClose',{id:'${esc(s.id)}',note:$('#sn').value},'Session closed')">Confirm close</button>`;
 if(s.k==='as')h=`<h1>Assign harvest · ${esc(s.bed)}</h1><select id="sw">${W}</select><label class="mut" for="sd" style="display:block;margin-top:8px">What is it about? (shown to the worker)</label><textarea id="sd" rows="3">Harvest the ready cohort, weigh each tote, then complete the session.</textarea><button class="btn p" style="width:100%;margin-top:10px" onclick="act('dispatch',{bed:'${esc(s.bed)}',date:'${today()}',desc:$('#sd').value,items:[{act:'Harvest',worker:$('#sw').value}]},'Harvest assigned')">Assign</button>`;
 return`<div class="ov" onclick="if(event.target===this){SH=null;draw()}"><div class="sh" role="dialog">${h}<button class="btn" style="width:100%;margin-top:8px" onclick="SH=null;draw()">Cancel</button></div></div>`}
function reDo(){const d={id:SH.id,worker:$('#sw').value,note:$('#sn').value};act(SH.q?'mReassignTask':'mReassign',d,'Reassigned')}
const draw=()=>{$('#ov').innerHTML=SH?sheet():''};
const TABS=[['today','Today'],['ready','Harvest ready'],['complete','Harvest complete'],['log','Activity log'],['moves','Reassignments'],['scout','Scouting']];
function render(){const a=$('#app');if(!SESS){a.innerHTML=vLogin();return draw()}
 const v={today:vToday,ready:vReady,complete:vComplete,log:vLog,moves:vMoves,scout:vScout}[V]();
 a.innerHTML=`<header><b>HT-ManagerApp</b><span class="dot ${on?'':'off'}">${on?'● Connected':'● Offline'}</span><div class="who"><b>${esc(ME.name)}</b><small>${esc(ME.role)}</small></div><button class="btn" style="min-height:40px;padding:4px 12px" onclick="load()">Refresh</button><button class="btn" style="min-height:40px;padding:4px 12px" onclick="out()">Log out</button></header>
 <div class="tabs">${TABS.map(t=>`<button class="${V===t[0]?'on':''}" onclick="V='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
 <main>${ERR?`<div class="err">${esc(ERR)}</div>`:''}${v}</main>`;draw()}

/* ---------- camera QR (BarcodeDetector) ---------- */
let cs=null,ct=0;
async function scanQR(){let det;try{det=new BarcodeDetector({formats:['qr_code']});cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('Camera unavailable. Type the bed ID instead.')}
 SH=null;const o=document.createElement('div');o.id='camov';o.className='ov';o.innerHTML='<div class="sh"><h1>Point at a bed QR code</h1><video id="cv" playsinline muted></video><button class="btn" style="width:100%;margin-top:8px" onclick="camStop()">Cancel</button></div>';document.body.appendChild(o);
 const v=$('#cv');v.srcObject=cs;try{await v.play()}catch(e){}
 ct=setInterval(async()=>{try{const r=await det.detect(v);if(r.length){const b=parseBed(r[0].rawValue);camStop();HQ=b||r[0].rawValue;render()}}catch(e){}},400)}
function camStop(){clearInterval(ct);if(cs){cs.getTracks().forEach(t=>t.stop());cs=null}const o=$('#camov');if(o)o.remove()}

/* ---------- demo backend (WEB_APP_URL = '') ---------- */
function mock(a,d){const n=now(),H=36e5;
 if(!mock.s)mock.s={D:{beds:{},workers:['lisa','Amani','Baraka','Chebet','Dawa'],tasks:[{id:'T1',bed:'HT-B2-03',act:'Harvest',worker:'Amani',status:'ASSIGNED',date:today()},{id:'T2',bed:'HT-B1-02',act:'Weeding',worker:'Dawa',status:'ASSIGNED',date:today()},{id:'T3',bed:'HT-B4-01',act:'Irrigation check',worker:'Chebet',status:'RUNNING',date:today()}],
