<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HT Manager</title>
<style>
:root{--bg:#eef1ee;--card:#fff;--ink:#0d1b14;--mut:#53645a;--line:#cdd6cf;--hd:#0d1b14;--hdi:#f2f6f2;--acc:#0b6b3a;--on:#fff;--must:#c62d1f;--att:#b86e00;--ok:#0b6b3a}
@media(prefers-color-scheme:dark){:root{--bg:#0b130e;--card:#15221a;--ink:#eef4ee;--mut:#9fb2a5;--line:#2a3d30;--hd:#050b07;--acc:#52c985;--on:#06110a;--must:#ff7a6b;--att:#f0b04a;--ok:#52c985}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{background:var(--hd);color:var(--hdi);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:18px;flex:1;min-width:0}
header .btn{background:none;border-color:rgba(255,255,255,.35);color:var(--hdi);min-height:38px;padding:4px 14px}
.sub{max-width:720px;margin:0 auto;padding:10px 14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.live{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:4px 0;font:inherit;font-size:14px;color:var(--ok);font-weight:700;cursor:pointer}
.live i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}.live.off{color:var(--must)}
main{max-width:720px;margin:0 auto;padding:6px 14px calc(96px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;overflow-x:auto;background:var(--hd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1 0 auto;background:none;border:0;color:var(--hdi);opacity:.72;font:inherit;font-size:13px;font-weight:700;padding:8px 12px;min-height:48px;border-radius:10px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
nav button.on{opacity:1;background:var(--acc);color:var(--on)}
nav .bd{background:var(--must);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;line-height:1.5}
h1{font-size:22px;margin:12px 0 6px}h2{font-size:17px;margin:18px 0 8px}.mut{color:var(--mut);font-size:14px}
button,input,select,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px;font-weight:700;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--on)}.btn.w{border-color:var(--att);color:var(--att)}.btn:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--ok);border-radius:12px;padding:12px;margin-bottom:10px}
.card.PAUSED,.card.Attention{border-left-color:var(--att)}.card.Must,.card.HIGH{border-left-color:var(--must)}.card.MEDIUM{border-left-color:var(--att)}.card.flat{border-left-color:var(--line)}
.r{display:flex;gap:8px;align-items:center}.r>.g{flex:1;min-width:0}.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns .btn{flex:1}
.t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--ok);color:var(--on)}.tag.PAUSED,.tag.MEDIUM{background:var(--att)}.tag.HIGH{background:var(--must)}.tag.LOW{background:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips .btn{min-height:42px;padding:6px 12px}.chips .on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.chips .btn span{opacity:.75;margin-left:4px}
.err{background:var(--must);color:#fff;padding:10px 12px;border-radius:12px;margin:8px 0}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.kv span{display:block;font-size:12px;color:var(--mut)}.kv b{font-size:17px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
#login{max-width:380px;margin:12vh auto 0;padding:0 14px}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;display:none}
video{width:100%;border-radius:12px;background:#000}
.rb{margin-top:6px;padding:6px 10px;border-radius:10px;background:rgba(184,110,0,.14);border-left:4px solid var(--att);font-size:14px}
.list{max-height:280px;overflow:auto;border:2px solid var(--line);border-radius:12px;padding:4px;background:var(--card)}
.list .btn{display:block;width:100%;text-align:left;margin:2px 0;min-height:42px;padding:8px 10px;border-color:transparent}.list .btn.on{background:var(--acc);color:var(--on)}
label.f{display:block;margin:12px 0 4px}
nav svg{width:18px;height:18px;flex:none}
nav .bd.soft{background:var(--mut)}
.bn{background:var(--must);color:#fff;padding:10px 14px;text-align:center;font-weight:700;font-size:14px}
.err[hidden]{display:none}
.bl{background:none;border:0;padding:2px 0;font:inherit;font-weight:800;color:var(--acc);text-decoration:underline;cursor:pointer;min-height:32px;text-align:left}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;background:var(--acc)}
.card[role=button]{cursor:pointer}
details>summary{min-height:32px}
.sh h1:focus{outline:none}
</style></head><body>
<div id="app"></div><div id="ov"></div><div id="toast"></div>
<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbxOW7gq6C_jkWB5fVaFsO8sZmCwgsnPOU353own_8i-bPARdx0MGBKRjNO7lAPhZApTVw/exec'; // '' = demo mode (built-in sample data)
const REQUEST_TIMEOUT_MS=20000,BOARD_REFRESH_MS=30000;
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GSR=()=>typeof google!=='undefined'&&!!(google.script&&google.script.run);
/* tolerant getter: first present key, ignoring case, spaces and underscores */
const nk=k=>String(k).toLowerCase().replace(/[\s_]/g,'');
const g=(o,...ks)=>{if(!o)return'';for(const k of ks){if(o[k]!=null&&o[k]!=='')return o[k];const f=Object.keys(o).find(x=>nk(x)===nk(k));if(f&&o[f]!=null&&o[f]!=='')return o[f]}return''};
const AF0=()=>({bed:'',cat:'ALL',q:'',acts:[],ws:[],date:'',desc:''});
let SESS='',ME=null,V='board',SH=null,ERR='',on=navigator.onLine,busy=0,last=0,FL={sev:'',dom:'',q:''},HQ='',LE='',BF='ALL',TF='ALL',AF=AF0(),TQ=0,GRW=0,LV='done',LW='',LB='';   // session token lives in memory only
let D={beds:{},cohorts:[],tasks:[],exceptions:[],workers:[],catalog:[]},X={open:[],done:[],scout:[],moves:[]};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},now=()=>Date.now();
const el=s=>(g(s,'end')||(g(s,'status')==='PAUSED'?g(s,'pauseAt'):now()))-g(s,'start')-(+g(s,'pausedMs')||0);
const fmt=ms=>{let s=Math.max(0,Math.floor(ms/1e3));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')};
const mn=x=>x<60?x+' min':Math.floor(x/60)+' h '+x%60+' min';
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.setAttribute('role','status');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',bad?6000:2800)};

/* ---------- API: Apps Script /exec (text/plain JSON) or built-in demo ---------- */
async function api(a,d){
 if(!WEB_APP_URL&&!GSR())return mock(a,d||{});
 const body=JSON.stringify({action:a,session:SESS,...d}),ac=new AbortController(),t=setTimeout(()=>ac.abort(),REQUEST_TIMEOUT_MS);
 try{let r;
  if(GSR())r=JSON.parse(await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).apiCall(body)));
  else r=await(await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ac.signal})).json();
  on=true;if(!r.ok){if(r.auth)out('Session expired. Please sign in again.');throw new Error(r.error||'Server error')}return r}
 catch(e){if(e.name==='AbortError')throw new Error('Request timed out. Check signal.');if(e instanceof TypeError){on=false;throw new Error('Cannot reach the server.')}throw e}
 finally{clearTimeout(t)}}
let again=0,acting=0;
async function load(){if(!SESS)return;if(busy){again=1;return}busy=1;try{const r=await api('mBoard');D=r.data||D;X=r.x||X;last=now();ERR=''}catch(e){ERR=e.message}busy=0;render();if(again){again=0;load()}}
const serr=m=>{const e=$('#serr');if(e&&SH){e.textContent=m;e.hidden=false;e.scrollIntoView({block:'nearest'})}else toast(m,1)};
async function run(fn,msg,redraw){if(acting)return;acting=1;try{await fn();SH=null;draw();toast(msg);await load()}catch(e){if(redraw){await load();draw()}serr(e.message)}acting=0}
const act=(a,d,msg)=>run(()=>api(a,d),msg);

/* ---------- auth: Manager / Founder only ---------- */
async function login(){const id=$('#u').value.trim(),pin=$('#p').value;if(!id||!pin){LE='Enter your Worker ID and PIN.';return render()}
 LE='';busy=1;render();
 try{const r=await api('login',{userId:id,pin,ua:navigator.userAgent.slice(0,160)});
  if(!/^(manager|founder)$/i.test(g(r.user,'role'))){SESS=r.session;api('logout').catch(()=>{});SESS='';throw new Error('Access denied: Manager or Founder accounts only.')}
  SESS=r.session;ME=r.user;D=r.data||D;busy=0;V='board';await load()}
 catch(e){busy=0;SESS='';LE=e.message;render()}}
function out(msg){if(SESS)api('logout').catch(()=>{});SESS='';ME=null;SH=null;LE=msg||'';render()}

/* ---------- derived ---------- */
const exOpen=b=>(D.exceptions||[]).filter(e=>g(e,'bed')===b&&g(e,'open'));
const parseBed=q=>{const m=/(?:HT-?)?B\s*([1-6])[-_ ]\s*0?([1-6])(?!\d)/i.exec(String(q));return m?`HT-B${m[1]}-0${m[2]}`:''};
const workers=()=>(D.workers&&D.workers.length?D.workers:[]);
const bshort=b=>String(b||'').replace(/^HT-/,''),Q=()=>X.queue||(D.tasks||[]).filter(t=>g(t,'status')==='ASSIGNED'),
 cropOf=id=>{const c=(D.cohorts||[]).find(x=>g(x,'id')===id);return c?g(c,'cropName','crop'):''};
const bedList=()=>{const o=[];for(let b=1;b<=6;b++)for(let n=1;n<=6;n++)o.push(`HT-B${b}-0${n}`);return o};
const BS=id=>(D.beds&&D.beds[id])||{},turnOf=id=>g(BS(id),'turn')||null;
/* crew tasks: the backend returns one row per crew member; fold them back into one task */
function cg(){const m={},o=[];(D.tasks||[]).forEach(t=>{const id=g(t,'id');if(!m[id]){m[id]={id,bed:g(t,'bed'),act:g(t,'act'),status:g(t,'tstatus')||g(t,'status'),vBy:g(t,'vBy'),vAt:g(t,'vAt'),vNote:g(t,'vNote'),crew:[]};o.push(m[id])}m[id].crew.push(t)});return o}
/* ---------- derived: dates, beds, cohorts, harvest window, Today queue ---------- */
const BLOCK=['NO CROP','BAD CROP','NO PLANT DATE','BAD BED','BLOCK/BED MISMATCH','BED OVERLAP'];
const pd=s=>/^\d{4}-\d{2}-\d{2}/.test(String(s||''))?new Date(String(s).slice(0,10)+'T00:00:00'):null,
 dd=(a,b)=>{const x=pd(a),y=pd(b);return x&&y?Math.round((x-y)/864e5):NaN},
 fday=s=>{const d=pd(s);return d?d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}):''},
 dayHead=ms=>{const d=new Date(ms),n=new Date(),y=new Date(n.getTime()-864e5),ds=x=>x.toDateString();return ds(d)===ds(n)?'Today':ds(d)===ds(y)?'Yesterday':d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'})},
 atMs=a=>{const s=String(a||'');if(/^today/i.test(s))return now();const t=Date.parse(s.replace(' ','T'));return isNaN(t)?NaN:t};
const cropNm=id=>{const c=(D.crops||[]).find(x=>g(x,'id')===id);return c?g(c,'name'):id};
const cohOn=b=>(D.cohorts||[]).filter(c=>g(c,'bed')===b);
const STG={PRE_PLANTING:'Waiting to plant',ACTIVE:'Growing',HARVEST_READY:'Ready to harvest',HARVESTING:'Harvesting',COMPLETED:'Harvest complete'},
 BST={AVAILABLE:'Available',RESERVED:'Reserved',OCCUPIED:'Growing',HARVEST_READY:'Harvest ready',HARVESTING:'Harvesting',POST_HARVEST:'Post-harvest',TURNOVER:'Turnover',HOLD:'On hold'};
const plantItem=id=>(VV().plant||[]).find(x=>x.cohort===id),finishItem=b=>(VV().finish||[]).find(x=>x.bed===b),relItem=b=>(VV().release||[]).find(x=>x.bed===b),openWin=id=>(VV().harvest||[]).find(x=>x.cohort===id);
/* harvest window: from the cohort (min/max, needs the updated backend) or, failing that, the Verify board's open-window list */
function win(c){const id=g(c,'id'),w=openWin(id),min=g(c,'min')||(w?w.min:''),max=g(c,'max')||(w?w.max:'');return{min,max,open:!!w||(!!min&&dd(min,today())<=0)}}
function winText(c){const w=win(c);if(!w.min)return'';const d=dd(w.min,today());return(d>0?'Window opens '+fday(w.min)+' (in '+d+' day'+(d>1?'s':'')+')':'Window open since '+fday(w.min)+(d<0?' ('+(-d)+' day'+(d<-1?'s':'')+' ago)':''))+(w.max?', closes '+fday(w.max):'')}
const bedBtn=(b,l)=>`<button class="bl" data-a="${esc(b)}" onclick="go('bed',this.dataset.a)">${esc(l||b)}</button>`;
const B=(l,k,a,c,b,st)=>`<button class="btn ${c||''}"${st?` style="${st}"`:''} data-a="${esc(a)}" data-b="${esc(b||'')}" onclick="go('${k}',this.dataset.a,this.dataset.b)">${l}</button>`;
const KEY=`onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"`;
const openBeds=()=>Object.keys(D.beds||{}).filter(id=>['AVAILABLE','RESERVED'].includes(g(BS(id),'status'))&&!turnOf(id)).sort();
/* turnover checklist: the required steps are the catalog rows flagged req; every one not in the bed's "left" list is done */
function turnSteps(bed){const t=turnOf(bed);if(!t)return[];const left=(t.left||[]).map(a=>a.id),ri=relItem(bed),rs={};(ri?ri.steps:[]).forEach(s=>{rs[s.id]=s});
 let C=(D.catalog||[]).filter(a=>a.req&&a.req!=='NO');if(!C.length)C=t.left||[];
 return C.map(a=>{const ok=!left.includes(a.id),r=rs[a.id];return{id:a.id,name:a.name,ok,st:r?r.st:ok?'OK':'MISSING'}})}
/* Today: p 1 Must do, 2 Attention, 3 Routine */
function tq(){const t=today(),o=[],add=(p,bed,title,detail,btn,sort)=>o.push({p,bed:bed||'',title,detail,btn,sort:String(sort||'9999')}),crew=b=>[...(X.open||[]),...Q()].some(s=>g(s,'bed')===b&&g(s,'act')==='Harvest');
 (D.proposals||[]).forEach(p=>{const id=g(p,'id'),b=g(p,'bed'),k=g(p,'check');add(1,b,'Approve a bed for '+cropNm(g(p,'crop')),'Planned '+(fday(g(p,'plant'))||'no date')+(b?', suggested '+b:', no bed suggested')+(BLOCK.includes(k)?' · blocked: '+k:''),B('Review','prop',id,'p'),g(p,'plant'))});
 (D.cohorts||[]).forEach(c=>{const id=g(c,'id'),bed=g(c,'bed'),st=g(c,'status'),cr=g(c,'cropName','crop'),dob=g(c,'dob');
  if(st==='PRE_PLANTING'){const d=dd(dob,t),pi=plantItem(id);
   if(pi)add(d<=3?1:3,bed,'Verify the bed is ready for '+cr,(d<=0?'Planting was due ':'Planting planned ')+fday(dob)+' · '+pi.verified+' of '+pi.total+' prep steps verified',B('Verify bed','vp',id,'p'),dob);
   else add(d<=0?2:3,bed,(d<=0?'Planting due: ':'Waiting to plant: ')+cr,'Planned '+(fday(dob)||'no date')+'. Workers record planting in the field app.',B('Open bed','bed',bed),dob)}
  else if(st==='ACTIVE'){const w=win(c),d=w.min?dd(w.min,t):NaN;
   if(w.open)add(1,bed,'Check harvest maturity of '+cr,winText(c),B('Verify ready','vh',id,'p'),w.min);
   else if(d<=3)add(2,bed,cr+' harvest window opens soon',winText(c),B('Open bed','bed',bed),w.min);
   else add(3,bed,'Growing: '+cr,winText(c)||'Planted '+(fday(dob)||dob),B('Open bed','bed',bed),w.min||'9999')}
  else if(st==='HARVEST_READY'||st==='HARVESTING'){const f=finishItem(bed);
   if(f)add(1,bed,'Mark harvest finished for '+cr,f.sessions+' session'+(f.sessions>1?'s':'')+' done · '+f.lbs+' lb',B('Mark finished','vf',bed,'p'),'0');
   else if(crew(bed))add(3,bed,cr+' harvest in progress','Mark it finished once the totes are in',B('Open bed','bed',bed),'0');
   else add(1,bed,'Assign a harvest crew for '+cr,'Maturity verified, nobody assigned yet',B('Assign harvest','as',bed,'p'),'0')}});
 Object.keys(D.beds||{}).forEach(id=>{const t2=turnOf(id),st=g(BS(id),'status'),ri=relItem(id);
  if(t2){if(ri)add(1,id,'Verify turnover and release the bed',ri.verified+' of '+ri.total+' steps verified · day '+t2.days+' · SLA '+t2.sla,B('Release bed','vb',id,'p'),'0');
   else add(t2.sla==='RED'?1:t2.sla==='YELLOW'?2:3,id,'Finish turnover steps',(t2.remaining!=null?t2.remaining:'?')+' step'+(t2.remaining===1?'':'s')+' left · day '+t2.days+' · SLA '+t2.sla,B('Checklist','tu',id),'1')}
  if(st==='HOLD')add(2,id,'Bed is on hold',g(BS(id),'hold')||'No reason recorded',B('Open bed','bed',id),'2')});
 (X.open||[]).filter(s=>g(s,'status')==='PAUSED').forEach(s=>add(2,g(s,'bed'),'Paused: '+g(s,'act'),g(s,'worker')+(g(s,'reason')?': '+g(s,'reason'):''),B('Reassign','re',g(s,'id')),'0'));
 Q().forEach(s=>{const late=g(s,'date')&&dd(g(s,'date'),t)<0;add(late?2:3,g(s,'bed'),g(s,'act')+', not started',g(s,'worker')+', assigned '+(fday(g(s,'date'))||'no date'),B('Reassign','re',g(s,'id'),'','1'),g(s,'date'))});
 (D.exceptions||[]).filter(e=>g(e,'open')).forEach(e=>add(g(e,'sev')==='HIGH'?1:2,g(e,'bed'),(g(e,'sev')||'Open')+' exception',g(e,'text'),B('Resolve','ex',g(e,'id')),'1'));
 (X.scout||[]).filter(f=>g(f,'sev')==='HIGH'&&(isNaN(atMs(g(f,'at')))||now()-atMs(g(f,'at'))<3*864e5)).forEach(f=>add(2,g(f,'bed'),'High-severity scouting finding',g(f,'domain')+(g(f,'notes')?': '+g(f,'notes'):''),B('View','find',g(f,'id')),'1'));
 const pn=(VV().pending||[]).length;if(pn)add(2,'',pn+' finished step'+(pn>1?'s':'')+' waiting for verification','Workers finished these. Sign them off on the Verify tab.',B('Open Verify','tab','verify'),'1');
 return o.sort((a,b)=>a.p-b.p||a.sort.localeCompare(b.sort)||a.bed.localeCompare(b.bed))}

/* ---------- cards ---------- */
function sCard(s,tools){const p=g(s,'status')==='PAUSED';
 return`<div class="card ${esc(g(s,'status'))}"><div class="r"><div class="g"><span class="tag ${esc(g(s,'status'))}">${p?'PAUSED · '+esc(g(s,'reason')||'no reason'):esc(g(s,'status')||'DONE')}</span>
 <div style="font-weight:800;font-size:18px;margin-top:4px">${esc(g(s,'bed'))} · ${esc(g(s,'act'))}</div><div class="mut">${esc(g(s,'worker'))}${g(s,'cohort')?' · '+esc(g(s,'cohort')):''}${g(s,'qty')?' · '+Math.round(g(s,'qty')*10)/10+' lb':''}</div></div>
 <div class="t" data-t="${esc(g(s,'id'))}">${fmt(el(s))}</div></div>${tools?`<div class="btns"><button class="btn" onclick="SH={k:'re',id:'${esc(g(s,'id'))}'};draw()">Reassign</button><button class="btn w" onclick="SH={k:'cl',id:'${esc(g(s,'id'))}'};draw()">Close out</button></div>`:''}</div>`}
const reP=r=>{try{return typeof r==='string'?(r?JSON.parse(r):null):r}catch(e){return null}};
const reBox=r=>{r=reP(r);return r&&r.from?`<div class="rb">↪ Reassigned from <b>${esc(r.from)}</b> to <b>${esc(r.to)}</b>${r.note?' · “'+esc(r.note)+'”':''}</div>`:''};

 const v=$('#cv');v.srcObject=cs;try{await v.play()}catch(e){}
